# Runs the FastAPI backend and the Streamlit UI together; the UI talks to the API.
services:
  api:
    build: .
    command: uvicorn mf_assistant.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  ui:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      - MF_API_URL=http://api:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - api
