[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-assistant"
version = "1.0.0"
description = "Facts-Only MF Assistant — a RAG FAQ system for HDFC mutual fund schemes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.6",
    "faiss-cpu>=1.7",
    "google-generativeai>=0.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
