name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests eval app.py scripts

      - name: Type-check (mypy)
        run: mypy

      - name: Unit + integration tests (pytest + coverage)
        run: pytest --cov --cov-report=term-missing

      - name: Evaluation harness (fails if routing accuracy < 90%)
        run: python eval/run_eval.py
